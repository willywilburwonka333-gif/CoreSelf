name: Verify Genesis

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - genesis-1.4-second-self-runtime
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Regression checks
        run: npm run check
